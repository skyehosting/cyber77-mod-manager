# Every push to main publishes a new version: tests, build, a check that no key ships, then a
# GitHub release. Installed copies of the app find it (latest.yml) and update themselves.
name: Release

on:
  push:
    branches: [main]
    # The project page (docs/) is published by GitHub Pages; a change to it alone is not a new version.
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: 1.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check for keys in the source
        run: node tools/check-secrets.js

      - name: Set the version
        run: npm version $env:VERSION --no-git-tag-version --allow-same-version

      # The app ships 7-Zip (unmodified, with its license) for people who have not installed it.
      - name: Bundle 7-Zip
        run: |
          New-Item -ItemType Directory -Force build/7zip | Out-Null
          Copy-Item "C:\Program Files\7-Zip\7z.exe","C:\Program Files\7-Zip\7z.dll","C:\Program Files\7-Zip\License.txt" build/7zip

      - name: Build
        run: npx electron-builder --win --publish never

      # app.asar is where the app's code is packed: unpack it so the check reads every file.
      - name: Check for keys in the built app
        run: |
          npx @electron/asar extract dist/win-unpacked/resources/app.asar dist/asar-check
          node tools/check-secrets.js dist/asar-check dist/win-unpacked/resources

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as a variable: a commit message with quotes must not break the command.
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          $exe = "dist/Edgerunners-Mod-Manager-Setup-$env:VERSION.exe"
          # The same installer under fixed names: .../releases/latest/download/Edgerunners-Mod-Manager-Setup.exe
          # always downloads the newest version (the site's and the README's Download link); the old
          # Cyber-Mod-Manager-Setup.exe name keeps working for links made before the rename.
          Copy-Item $exe dist/Edgerunners-Mod-Manager-Setup.exe
          Copy-Item $exe dist/Cyber-Mod-Manager-Setup.exe
          gh release create "v$env:VERSION" $exe "$exe.blockmap" dist/latest.yml dist/Edgerunners-Mod-Manager-Setup.exe dist/Cyber-Mod-Manager-Setup.exe `
            --title "Edgerunners Mod Manager $env:VERSION" `
            --notes "$env:NOTES" `
            --latest

  # Linux (Steam, under Proton): a .deb and an AppImage, added to the release the job above made. A
  # failure here never holds back the Windows release. The AppImage updates itself (latest-linux.yml).
  linux:
    needs: release
    runs-on: ubuntu-latest
    env:
      VERSION: 1.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # The whole suite ran on Windows above; here the Linux parts.
      - name: Test (Linux)
        run: node --require ./test/setup.cjs --test test/linux-*.test.js test/host-env.test.js

      - name: Check for keys in the source
        run: node tools/check-secrets.js

      - name: Set the version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build
        run: npx electron-builder --linux --publish never

      - name: Check for keys in the built app
        run: |
          npx @electron/asar extract dist/linux-unpacked/resources/app.asar dist/asar-check
          node tools/check-secrets.js dist/asar-check dist/linux-unpacked/resources

      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="dist/Edgerunners-Mod-Manager-$VERSION"
          # Fixed names too: .../releases/latest/download/Edgerunners-Mod-Manager.deb (and .AppImage)
          # always downloads the newest version.
          cp "$base.deb" dist/Edgerunners-Mod-Manager.deb
          cp "$base.AppImage" dist/Edgerunners-Mod-Manager.AppImage
          gh release upload "v$VERSION" "$base.deb" "$base.AppImage" dist/latest-linux.yml \
            dist/Edgerunners-Mod-Manager.deb dist/Edgerunners-Mod-Manager.AppImage --clobber
