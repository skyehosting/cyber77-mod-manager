<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none';">
  <title>Edgerunners Mod Manager</title>
  <style>
    :root { --text: #e8ebf0; --muted: #98a2b3; --track: rgba(255,255,255,0.1); --accent: #f5c518; --accent-ink: #14161a; --line: rgba(255,255,255,0.12); }
    :root.light { --text: #1b1f27; --muted: #5d6676; --track: rgba(0,0,0,0.1); --line: rgba(0,0,0,0.14); }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.9rem;
      padding: 1.4rem 1.6rem; background: transparent; color: var(--text);
      font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      border: 1px solid var(--line); user-select: none; -webkit-app-region: drag; cursor: default;
    }
    .mark { width: 44px; height: auto; aspect-ratio: 1; display: grid; place-items: center; border-radius: 10px; background: var(--accent); color: var(--accent-ink); }
    .mark svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .name { font-weight: 600; font-size: 15px; }
    .status { color: var(--muted); font-size: 13px; text-align: center; min-height: 1.4em; }
    .bar { width: 100%; height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; }
    .bar > span { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .2s; }
    .bar.busy > span { width: 35%; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
    @media (prefers-reduced-motion: reduce) { .bar.busy > span { animation: none; width: 100%; opacity: 0.5; } }
    a { color: var(--muted); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; -webkit-app-region: no-drag; }
    a:hover, a:focus-visible { color: var(--text); }
  </style>
</head>
<body>
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h16v11l-5 5H4Z"/><path d="M9 9h6M9 13h4"/></svg></div>
  <div class="name">Edgerunners Mod Manager</div>
  <div class="bar busy" id="bar" role="progressbar" aria-label="Update"><span></span></div>
  <div class="status" id="status" role="status">Checking for updates…</div>
  <a href="#open" id="open">Open now</a>
  <script src="splash.js"></script>
</body>
</html>
